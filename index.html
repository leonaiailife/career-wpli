<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>理出自己｜女力職涯探索</title>
<style>
:root{--bg:#f5f0e7;--paper:#fffdf8;--ink:#29372f;--muted:#69746c;--g:#557b5c;--g2:#e2eddf;--gold:#c99b53;--rose:#efd9d3;--blue:#dcebef;--line:#ded8cc;--dark:#243129}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#fff8eb,transparent 35%),linear-gradient(145deg,#f5f0e7,#eaf1e8);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}.app{min-height:100vh}
header{position:sticky;top:0;z-index:30;background:#fffdf8ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:11px 15px;display:flex;gap:8px;align-items:center}.logo{font-weight:950}.grow{flex:1}.pill{background:var(--g2);border-radius:999px;padding:6px 9px;font-size:12px;font-weight:800}
.progress{height:7px;background:#e5e0d7}.progress div{height:100%;background:linear-gradient(90deg,var(--g),var(--gold));transition:.35s}
main{max-width:850px;margin:auto;padding:24px 17px 105px}.card{background:#fffdf8;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 12px 32px #29372f12;animation:rise .3s ease}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:900;color:var(--g)}h1{font-size:34px;margin:9px 0 13px}h2{font-size:27px;margin:8px 0 12px}h3{margin:8px 0}p{line-height:1.75}.small{font-size:13px;color:var(--muted);line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.opt{position:relative;border:2px solid var(--line);border-radius:17px;background:white;padding:16px;text-align:left;min-height:76px;transition:.15s;user-select:none;-webkit-tap-highlight-color:transparent}.opt:active{transform:scale(.98)}.opt.selected{background:var(--g2);border-color:var(--g);box-shadow:0 0 0 3px #557b5c18}.opt.selected:after{content:"✓";position:absolute;right:11px;top:9px;background:var(--g);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-weight:900}.ico{font-size:25px;display:block;margin-bottom:5px}
input,textarea{width:100%;padding:14px;border:2px solid var(--line);border-radius:14px;background:#fff;outline:0}textarea{min-height:92px;resize:vertical}input:focus,textarea:focus{border-color:var(--g)}
.btn{border:0;border-radius:14px;background:var(--g);color:#fff;padding:12px 16px;font-weight:900;cursor:pointer}.btn.secondary{background:#ebe7dd;color:var(--ink)}.btn.gold{background:var(--gold)}.btn:disabled{opacity:.42;cursor:not-allowed}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:21px;flex-wrap:wrap}.notice{background:#f3eee2;border-radius:15px;padding:12px 14px;font-size:13px}.tags span,.badge{display:inline-block;background:#eee9df;border-radius:999px;padding:7px 10px;margin:4px;font-size:13px}.badge{background:#f2e2bd;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px}.stat b{font-size:22px;display:block}.level{font-size:14px;font-weight:900}.bar{height:9px;background:#e7e2d9;border-radius:99px;overflow:hidden}.bar div{height:100%;background:linear-gradient(90deg,var(--g),var(--gold));transition:.5s}
.scene{background:linear-gradient(135deg,#eef4eb,#fff8ee);border-radius:18px;padding:17px;margin:15px 0}.scene b{font-size:17px}.flash{animation:flash .65s ease}@keyframes flash{0%{box-shadow:0 0 0 0 #c99b5366}100%{box-shadow:0 0 0 18px transparent}}
.deck{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.energy{min-height:175px;perspective:900px}.energyInner{transition:transform .55s;transform-style:preserve-3d;min-height:155px}.energy.flipped .energyInner{transform:rotateY(180deg)}.face{backface-visibility:hidden;border:2px solid var(--line);border-radius:17px;padding:15px;min-height:155px;background:#fff}.back{position:absolute;inset:0;transform:rotateY(180deg);background:linear-gradient(145deg,#f0e0bf,#fff9ec);border-color:var(--gold)}.energyWrap{position:relative}.face b{font-size:18px}.cardIcon{font-size:40px;margin:10px 0}
.scenario{min-height:135px}.lock{opacity:.5}.map{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.mapBtn{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;text-align:left;cursor:pointer}.mapBtn.done{background:var(--g2);border-color:var(--g)}.modal{position:fixed;inset:0;background:#1d292288;display:none;align-items:flex-end;z-index:60;padding:10px}.modal.show{display:flex}.modalBox{background:var(--paper);width:min(900px,100%);max-height:91vh;overflow:auto;border-radius:24px;padding:20px}
.resultMap{width:100%;max-width:600px;margin:auto;background:linear-gradient(155deg,#fffaf0,#eaf2e8);padding:30px 25px;border-radius:28px;border:1px solid #d8d3c7;box-shadow:0 15px 40px #26352f18}.resultMap .hero{font-size:29px;font-weight:950}.resultMap .line{height:1px;background:#d8d3c7;margin:18px 0}.quote{font-size:21px;font-weight:900;line-height:1.65}.chapterTitle{font-weight:950;margin-top:16px;color:var(--g)}
.toast{position:fixed;z-index:99;left:50%;bottom:24px;transform:translate(-50%,130px);background:var(--dark);color:#fff;padding:12px 17px;border-radius:999px;transition:.25s}.toast.show{transform:translate(-50%,0)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:25;background:#fffdf8f2;border-top:1px solid var(--line);backdrop-filter:blur(10px);display:flex;justify-content:center;gap:10px;padding:9px 14px calc(9px + env(safe-area-inset-bottom))}nav .btn{min-width:120px}
@media(max-width:600px){h1{font-size:29px}h2{font-size:24px}.grid,.deck,.map{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.card{padding:19px}.deck{grid-template-columns:1fr 1fr}nav .btn{min-width:0;flex:1}.resultMap{padding:22px 18px}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">🌱 理出自己</div><span class="pill" id="chapter"></span><span class="grow"></span><span class="pill" id="xp"></span><button class="btn secondary" id="mapBtn" type="button">🗺️ 關卡</button></header>
<div class="progress"><div id="progress"></div></div>
<main><div id="screen"></div></main>
<nav><button class="btn secondary" id="back" type="button">← 上一步</button><button class="btn" id="next" type="button">下一關 →</button></nav>
</div>
<div class="modal" id="modal"><div class="modalBox"><div class="actions" style="margin-top:0"><div><div class="eyebrow">自由探索模式</div><h2>5大章 × 17關卡</h2></div><button class="btn secondary" id="close" type="button">關閉</button></div><p class="small">每一關都是一次自我探索。完成暱稱與出生資料後，可自由進入其他關卡；不必照順序。</p><div class="map" id="map"></div></div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const levels=[
["nickname",1,1,"我是誰","先給今天的自己一個名字","text"],["birth",1,2,"生命靈數角色","讓一個象徵性的角色提示，陪妳探索","birth"],["state",1,3,"我的現在","此刻的妳，最接近哪一種狀態？","single",["有點累","有點迷惘","想很多","想改變","正在重新開始","充滿期待"]],["awareness",1,4,"最近的提醒","最近什麼訊號一直提醒妳：該照顧自己了？","multi",["身體累","睡不好","煩躁","焦慮","生氣","沒精神","想改變","不知道怎麼了"]],["radar",2,5,"覺察雷達","沒有標準答案，先聽聽現在的自己","radar"],["timeline",2,6,"人生回望","妳走過的路，就是能力的證據","timeline"],["superpower",2,7,"能力解鎖","從日常情境，看見妳早已擁有的韌力","scenario"],["skills",2,8,"我的超能力","把生活裡的會做，轉成職涯語言","multi",["時間管理","溝通協調","問題解決","情緒管理","資源整合","多工處理","危機應變","預算管理","規劃能力","臨場反應","同理與需求覺察","優先排序"]],["energy",3,9,"女力能量卡","翻開一張現在最需要的力量","energy"],["recover",3,10,"找回自己","妳想重新找回哪一個自己？","single",["有勇氣的我","有力量的我","有創意的我","有夢想的我"]],["values",3,11,"人生不只剩下應該","把真正重要的價值放回人生","multi",["自由","成長","經濟穩定","家庭","學習","創作","助人","被看見","生活品質","自我照顧"]],["wheel",4,12,"人生方向盤","把感覺整理成可以行動的方向","wheel"],["action",4,13,"夢想大，行動小","接下來7天，妳願意做哪一個小行動？","single",["整理一件卡住的事","完成一個15分鐘任務","主動詢問一個資源","為自己留一段時間","開始一個想做很久的嘗試","先休息，再重新出發"]],["support",4,14,"支持圈","韌力不是一個人硬撐，而是知道可以找誰","multi",["家人","朋友","同事／夥伴","社群","專業人士","學習資源","AI工具","我自己"]],["decision",5,15,"我的決定","選擇，是把力量拿回來","decision"],["reflection",5,16,"給自己的話","把今天的發現，變成一句可以帶走的話","reflection"],["result",5,17,"理出自我・脈絡地圖","妳的探索成果","result"]
];
const energies=[["勇氣","🔥","我可以害怕，但仍然往前一步。","完成一件原本想拖延的小事。"],["韌性","🌿","我不是沒有跌倒，而是一次次重新站起來。","寫下自己曾撐過的一件事。"],["自信","✨","我的能力，不需要等別人認可才存在。","列出3件我做得到的事。"],["自在","🕊️","我不必急著成為別人期待的樣子。","替自己留15分鐘不被打擾。"],["創意","🎨","換一種方法，也是一種能力。","把困擾改寫成可以嘗試的問題。"],["夢想","🌙","人生不只剩下應該，也可以有我想要的。","寫下一個真正想要的願望。"],["成長","🌱","不用一次完美，只要持續靠近。","投入一個技能15分鐘。"],["選擇","🧭","我可以選擇，也可以重新選擇。","對一件不必要的事說一次先不要。"],["行動","🚀","小小行動，比完美計畫更接近夢想。","做一個5分鐘版本。"],["界線","🛡️","照顧自己，是為了走得更久。","說清楚一個時間或情緒界線。"],["溫柔","💗","我可以用對重要朋友的方式對待自己。","對自己說一句肯定的話。"],["支持","🤝","我不需要一個人完成所有事情。","向可信任的人提出一個具體請求。"]];
const hints={1:["開創者","勇氣、自主、開始","妳可以從一個自己真正想做的決定開始。"],2:["連結者","關係、合作、感受","妳的感受與連結，是重要的導航資訊。"],3:["表達者","創意、表達、喜悅","妳可以讓創意與表達重新回到生活。"],4:["建構者","穩定、實踐、建構","妳已累積很多把事情落地的能力。"],5:["探索者","自由、探索、變化","妳可以探索新的可能，不必一次決定終身。"],6:["照顧者","照顧、責任、愛","照顧別人的同時，也別忘了把自己放回來。"],7:["思考者","思考、內在、探索","妳需要的可能不是更多答案，而是一點安靜空間。"],8:["實踐者","行動、成就、力量","妳有把想法變成成果的力量。"],9:["理想者","理想、助人、完整","妳可以助人，也讓自己成為被照顧的人."]};
const scenarios=[["child","👧","孩子突然生病，妳會怎麼處理？",["危機應變","資源整合","情緒管理"]],["budget","💰","月底預算不夠，妳會怎麼調整？",["預算管理","規劃能力","問題解決"]],["family","🏠","家人意見不同，妳會怎麼溝通？",["溝通協調","同理與需求覺察","問題解決"]],["multi","⏱️","一天突然塞進很多事情，妳會怎麼安排？",["時間管理","多工處理","優先排序"]]];
const defaults={nickname:"",birthDate:"",lifePath:null,state:"",awareness:[],radar:{emotion:3,need:3,energy:3,boundary:3,desire:3},timeline:["","",""],keywords:[],scenario:[],skills:[],energyCard:null,recover:"",values:[],direction:{want:"",dont:"",try:"",first:""},action:"",support:[],decision:"",reflection:"",xp:0,badges:[]};
let data;try{const raw=localStorage.getItem("rizi3");data=raw?JSON.parse(raw):null}catch(e){data=null}if(!data)data=JSON.parse(JSON.stringify(defaults));
const cloneDefaults=()=>JSON.parse(JSON.stringify(defaults));
let cur=Number(localStorage.getItem("rizi3cur")||0);if(cur<0||cur>16)cur=0;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function save(){try{localStorage.setItem("rizi3",JSON.stringify(data));localStorage.setItem("rizi3cur",String(cur))}catch(e){}}
function msg(t){$("toast").textContent=t;$("toast").classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>$("toast").classList.remove("show"),1600)}
function xp(n){data.xp+=n;badges();save();top()}
function badges(){const done=levels.filter((l,i)=>i>0&&i<16&&doneLevel(l)).length;const add=x=>{if(!data.badges.includes(x))data.badges.push(x)};if(data.lifePath)add("✨ 生命角色");if(data.energyCard!==null)add("🃏 女力賦能");if(done>=3)add("🌱 啟程者");if(done>=7)add("🌿 覺察者");if(done>=12)add("🌳 韌力行動者");if(done>=15)add("🏆 女力導航師")}
function calc(v){let n=(v.match(/\d/g)||[]).reduce((a,b)=>a+Number(b),0);while(n>9)n=String(n).split("").reduce((a,b)=>a+Number(b),0);return n}
function valid(v){const x=v.trim().replace(/[.\-]/g,"/").replace(/\s+/g,"");const m=x.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);if(!m)return false;const y=+m[1],mo=+m[2],d=+m[3],dt=new Date(y,mo-1,d);return dt.getFullYear()===y&&dt.getMonth()===mo-1&&dt.getDate()===d}
function doneLevel(l){switch(l[0]){case"nickname":return!!data.nickname;case"birth":return!!data.lifePath;case"state":return!!data.state;case"awareness":return data.awareness.length>0;case"radar":return true;case"timeline":return data.timeline.some(Boolean)||data.keywords.length>0;case"superpower":return data.scenario.length>0;case"skills":return data.skills.length>0;case"energy":return data.energyCard!==null;case"recover":return!!data.recover;case"values":return data.values.length>0;case"wheel":return Object.values(data.direction).some(Boolean);case"action":return!!data.action;case"support":return data.support.length>0;case"decision":return!!data.decision;case"reflection":return!!data.reflection;case"result":return true}return false}
function top(){const l=levels[cur],d=levels.filter(doneLevel).length;$("chapter").textContent=`第${l[1]}章 · ${l[2]}/17`;$("xp").textContent=`${data.xp} XP`;$("progress").style.width=Math.round(d/17*100)+"%";$("back").disabled=cur===0;$("next").style.display=cur===16?"none":"block"}
function single(opts,key){return opts.map((x,i)=>`<button type="button" class="opt ${data[key]===x?"selected":""}" data-single="${i}">${esc(x)}</button>`).join("")}
function multi(opts,key,max){return opts.map((x,i)=>`<button type="button" class="opt ${data[key].includes(x)?"selected":""}" data-multi="${i}">${esc(x)}</button>`).join("")+`<div class="small" style="grid-column:1/-1">已選 ${data[key].length} 項／最多 ${max}</div>`}
function render(){const l=levels[cur],id=l[0];let s="";
if(id==="nickname")s=`<div class="eyebrow">CHAPTER 1 · 安定自己</div><h1>今天，先把自己放回來</h1><p>妳不需要先證明自己很厲害。先給今天的自己一個名字。</p><input id="nickname" value="${esc(data.nickname)}" placeholder="例如：小綠、Leona、我自己"><div class="scene">🌱 <b>任務：登入妳自己的人生</b><br><span class="small">這個暱稱只會保存在本機成果中。</span></div>`;
else if(id==="birth")s=`<div class="eyebrow">CHAPTER 1 · 生命角色</div><h2>妳的生命靈數角色</h2><p>這不是診斷，而是一個讓妳開始思考自己的象徵提示。</p><input id="birth" value="${esc(data.birthDate)}" inputmode="numeric" placeholder="1981/08/23">${data.lifePath?`<div class="scene flash"><span class="badge">✨ ${hints[data.lifePath][0]} · 生命靈數 ${data.lifePath}</span><h3>${hints[data.lifePath][1]}</h3><p>${hints[data.lifePath][2]}</p></div>`:""}<div class="notice">任務：輸入出生年月日 → 解鎖妳的「生命角色」。</div>`;
else if(id==="state")s=`<div class="eyebrow">CHAPTER 1 · 任務 03</div><h2>此刻的妳，在哪裡？</h2><div class="scene">🎯 <b>任務：替現在的自己命名</b><br><span class="small">沒有對錯，只有此刻真實的感受。</span></div><div class="grid">${single(l[5],"state")}</div>`;
else if(id==="awareness")s=`<div class="eyebrow">CHAPTER 1 · 任務 04</div><h2>身體與情緒正在說什麼？</h2><div class="scene">🔍 <b>任務：找出最近最常出現的訊號</b></div><div class="grid">${multi(l[5],"awareness",3)}</div>`;
else if(id==="radar"){s=`<div class="eyebrow">CHAPTER 2 · 看見自己</div><h2>覺察雷達</h2><p>${l[4]}</p>`;[["emotion","情緒"],["need","需求"],["energy","能量"],["boundary","界線"],["desire","渴望"]].forEach(x=>s+=`<div style="display:grid;grid-template-columns:70px 1fr 25px;gap:9px;align-items:center;margin:17px 0"><b>${x[1]}</b><input type="range" min="1" max="5" value="${data.radar[x[0]]}" data-range="${x[0]}"><b id="rv${x[0]}">${data.radar[x[0]]}</b></div>`);s+=`<div class="notice">🎯 任務：不是改變自己，而是先看見自己。</div>`}
else if(id==="timeline")s=`<div class="eyebrow">CHAPTER 2 · 任務 06</div><h2>妳走過的路，都算數</h2><p>把生活經驗翻譯成職涯韌力。</p>${["我完成過的事","我撐過來的事","讓我改變的事"].map((x,i)=>`<label class="small">${x}</label><textarea data-time="${i}" placeholder="寫一件就好">${esc(data.timeline[i])}</textarea><div style="height:8px"></div>`).join("")}<label class="small">三個代表我的字</label><input id="keywords" value="${esc(data.keywords.join("、"))}" placeholder="例如：堅持、照顧、重新開始">`;
else if(id==="superpower")s=`<div class="eyebrow">CHAPTER 2 · 韌力解鎖</div><h2>生活，是妳的職涯訓練場</h2><p>點選最像妳的情境。每一次選擇，都會解鎖能力。</p><div class="grid">${scenarios.map(x=>`<button type="button" class="opt scenario ${data.scenario.includes(x[0])?"selected":""}" data-scenario="${x[0]}"><span class="ico">${x[1]}</span><b>${x[2]}</b><span class="small">${x[3].join("・")}</span></button>`).join("")}</div><div class="tags">${data.skills.map(x=>`<span>💎 ${esc(x)}</span>`).join("")}</div>`;
else if(id==="skills")s=`<div class="eyebrow">CHAPTER 2 · 任務 08</div><h2>把「我只是會做」變成「我具備能力」</h2><div class="grid">${multi(l[5],"skills",6)}</div>`;
else if(id==="energy")s=`<div class="eyebrow">CHAPTER 3 · 女力賦能</div><h2>女力能量卡・翻牌</h2><p>先選一張妳現在最需要的力量，再翻開它。</p><div class="deck">${energies.map((e,i)=>`<button type="button" class="energy opt ${data.energyCard===i?"selected flipped":""}" data-energy="${i}"><div class="energyWrap"><div class="energyInner"><div class="face"><div class="cardIcon">❔</div><b>女力能量</b><p class="small">點我翻牌</p></div><div class="face back"><div class="cardIcon">${e[1]}</div><b>${e[0]}</b><p>${e[2]}</p><p class="small">今日任務：${e[3]}</p></div></div></div></button>`).join("")}</div>`;
else if(id==="recover")s=`<div class="eyebrow">CHAPTER 3 · 任務 10</div><h2>妳想找回哪一個自己？</h2><div class="grid">${single(l[5],"recover")}</div>`;
else if(id==="values")s=`<div class="eyebrow">CHAPTER 3 · 任務 11</div><h2>人生，不只剩下應該</h2><div class="scene">❤️ <b>任務：選出值得重新放回人生的價值</b></div><div class="grid">${multi(l[5],"values",4)}</div>`;

function bind(){document.querySelectorAll("[data-single]").forEach(b=>b.addEventListener("click",()=>{const l=levels[cur],v=l[5][+b.dataset.single];if(l[0]==="state")data.state=v;if(l[0]==="recover")data.recover=v;if(l[0]==="action")data.action=v;xp(3);render()}));document.querySelectorAll("[data-multi]").forEach(b=>b.addEventListener("click",()=>{const l=levels[cur],v=l[5][+b.dataset.multi],key=l[0],arr=data[key],max=key==="awareness"?3:key==="values"?4:key==="skills"?6:3,i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else{if(arr.length>=max){msg(`最多選 ${max} 項`);return}arr.push(v)}xp(2);render()}));document.querySelectorAll("[data-range]").forEach(x=>x.addEventListener("input",()=>{data.radar[x.dataset.range]=+x.value;$("rv"+x.dataset.range).textContent=x.value;save()}));document.querySelectorAll("[data-time]").forEach(x=>x.addEventListener("input",()=>{data.timeline[+x.dataset.time]=x.value;save()}));const kw=$("keywords");if(kw)kw.addEventListener("input",()=>{data.keywords=kw.value.split(/[、,，\s]+/).filter(Boolean).slice(0,3);save()});document.querySelectorAll("[data-scenario]").forEach(b=>b.addEventListener("click",()=>{const id=b.dataset.scenario,sc=scenarios.find(x=>x[0]===id),i=data.scenario.indexOf(id);if(i>=0){data.scenario.splice(i,1);sc[3].forEach(sk=>{if(!data.scenario.some(q=>scenarios.find(z=>z[0]===q)?.[3].includes(sk))){const j=data.skills.indexOf(sk);if(j>=0)data.skills.splice(j,1)}})}else{data.scenario.push(id);sc[3].forEach(sk=>{if(!data.skills.includes(sk))data.skills.push(sk)})}xp(5);render()}));document.querySelectorAll("[data-energy]").forEach(b=>b.addEventListener("click",()=>{data.energyCard=+b.dataset.energy;xp(10);render()}));document.querySelectorAll("[data-dir]").forEach(x=>x.addEventListener("input",()=>{data.direction[x.dataset.dir]=x.value;save()}));const n=$("nickname");if(n)n.addEventListener("input",()=>{data.nickname=n.value.trim();save()});const bi=$("birth");if(bi)bi.addEventListener("input",()=>{data.birthDate=bi.value;save()});const de=$("decision");if(de)de.addEventListener("input",()=>{data.decision=de.value;save()});const re=$("reflection");if(re)re.addEventListener("input",()=>{data.reflection=re.value;save()})}
function validate(){const id=levels[cur][0];if(id==="nickname"){data.nickname=$("nickname").value.trim();if(!data.nickname){msg("請先輸入暱稱");return false}}if(id==="birth"){const v=$("birth").value.trim();if(!valid(v)){msg("請輸入正確日期，例如 1981/08/23");return false}data.birthDate=v.replace(/[.\-]/g,"/");data.lifePath=calc(data.birthDate);badges()}if(id==="timeline"){document.querySelectorAll("[data-time]").forEach(x=>data.timeline[+x.dataset.time]=x.value);const k=$("keywords");if(k)data.keywords=k.value.split(/[、,，\s]+/).filter(Boolean).slice(0,3)}if(id==="wheel")document.querySelectorAll("[data-dir]").forEach(x=>data.direction[x.dataset.dir]=x.value);if(id==="decision")data.decision=$("decision").value.trim();if(id==="reflection")data.reflection=$("reflection").value.trim();return true}
function next(){if(!validate())return;if(cur<16){if(!doneLevel(levels[cur]))xp(4);cur++;save();render();scrollTo(0,0)}}function back(){if(cur>0){validate();cur--;save();render();scrollTo(0,0)}}
function renderMap(){$("map").innerHTML=levels.map((l,i)=>`<button type="button" class="mapBtn ${doneLevel(l)?"done":""} ${i===cur?"flash":""}" data-go="${i}"><b>${l[2]}. ${l[3]} ${doneLevel(l)?"✓":""}</b><small class="small">第${l[1]}章 · ${l[4]}</small></button>`).join("");document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{cur=+b.dataset.go;save();closeMap();render();scrollTo(0,0)}))}function openMap(){renderMap();$("modal").classList.add("show")}function closeMap(){$("modal").classList.remove("show")}
function renderResult(){badges();const h=data.lifePath?hints[data.lifePath]:["探索者","尚未輸入",""];return `<div class="resultMap" id="resultMap"><div class="eyebrow">FINAL · 17/17</div><div class="hero">${esc(data.nickname||"我的")}・理出自我</div><p class="small">女力職涯 × 韌力 × 自我導航</p><div class="line"></div><div class="stats"><div class="stat"><span class="small">生命角色</span><b>${data.lifePath||"—"}</b></div><div class="stat"><span class="small">XP</span><b>${data.xp}</b></div><div class="stat"><span class="small">徽章</span><b>${data.badges.length}</b></div></div><div class="chapterTitle">🌱 安定自己</div><p>現在：${esc(data.state||"—")}<br>覺察：${data.awareness.map(esc).join("、")||"—"}</p><div class="chapterTitle">🔍 看見自己</div><p>超能力：${data.skills.map(x=>esc(x)).join("、")||"—"}<br>人生關鍵字：${data.keywords.map(esc).join("、")||"—"}</p><div class="chapterTitle">🃏 找回女力</div><p>生命角色：<b>${esc(h[0])}</b>｜${esc(h[1])}<br>找回：${esc(data.recover||"—")}<br>價值：${data.values.map(esc).join("、")||"—"}<br>能量卡：${data.energyCard!==null?esc(energies[data.energyCard][0]):"—"}</p><div class="chapterTitle">🧭 築夢踏實</div><p><b>想要：</b>${esc(data.direction.want||"—")}<br><b>不想要：</b>${esc(data.direction.dont||"—")}<br><b>願意試：</b>${esc(data.direction.try||"—")}<br><b>先做：</b>${esc(data.direction.first||"—")}<br><b>7日行動：</b>${esc(data.action||"—")}</p><div class="chapterTitle">🏆 自決人生</div><p><b>支持：</b>${data.support.map(esc).join("、")||"—"}<br><b>我的決定：</b>${esc(data.decision||"—")}</p><div class="line"></div><p class="quote">「${esc(data.reflection||"我願意把自己重新放回人生裡。")}」</p><div class="line"></div><div>${data.badges.map(x=>`<span class="badge">${esc(x)}</span>`).join("")}</div></div><div class="actions"><button class="btn gold" type="button" id="export">📸 輸出1080×1920脈絡地圖</button><button class="btn secondary" type="button" id="restart">重新開始</button></div>`}
function exportMap(){const W=1080,H=1920,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.fillStyle="#f5f0e7";x.fillRect(0,0,W,H);x.fillStyle="#29372f";x.font="900 52px sans-serif";x.fillText("理出自己｜女力職涯探索",60,90);x.font="900 40px sans-serif";x.fillText(`${data.nickname||"我的"}・人生脈絡地圖`,60,150);x.font="24px sans-serif";let y=225;const lines=[`生命角色：${data.lifePath||"—"} ${data.lifePath?hints[data.lifePath][0]:""}`,`現在：${data.state||"—"}`,`覺察：${data.awareness.join("、")||"—"}`,`超能力：${data.skills.join("、")||"—"}`,`能量卡：${data.energyCard!==null?energies[data.energyCard][0]:"—"}`,`找回自己：${data.recover||"—"}`,`價值：${data.values.join("、")||"—"}`,`想要：${data.direction.want||"—"}`,`不想要：${data.direction.dont||"—"}`,`願意試：${data.direction.try||"—"}`,`先做：${data.direction.first||"—"}`,`7日行動：${data.action||"—"}`,`支持：${data.support.join("、")||"—"}`,`我的決定：${data.decision||"—"}`,`給自己的話：${data.reflection||"我願意把自己重新放回人生裡。"}`,`XP：${data.xp}　徽章：${data.badges.join("、")||"探索中"}`];for(const t of lines){const a=t.match(/.{1,30}/g)||[""];for(const q of a){x.fillText(q,60,y);y+=46}y+=15}x.font="italic 25px sans-serif";x.fillText("每一次重新選擇，都是女力韌性的證明。",60,1840);c.toBlob(b=>{if(!b){msg("無法產生圖片，請改用較新的瀏覽器");return}const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="理出自己_1080x1920_人生脈絡地圖.png";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)})}
function restart(){if(confirm("確定重新開始嗎？")){data=cloneDefaults();cur=0;save();render()}}
