<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>理出自己｜女力職涯探索</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans TC",sans-serif;color:#29372f;background:#f4f0e7}button,input,textarea{font:inherit}.top{position:sticky;top:0;z-index:10;background:#fffdf9;border-bottom:1px solid #ddd6c8}.topin{max-width:980px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:10px}.logo{font-weight:900;font-size:18px}.spacer{flex:1}.pill{background:#e3eddf;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:800}.progress{height:6px;background:#e7e1d6}.progress>div{height:100%;background:#557b5c;transition:.3s}main{max-width:980px;margin:auto;padding:28px 18px 110px}.hero,.card{background:#fffdf9;border:1px solid #ddd6c8;border-radius:25px;box-shadow:0 10px 30px #29372f12}.hero{padding:34px;margin-bottom:16px}.hero h1{font-size:40px;margin:8px 0}.hero p{line-height:1.8;color:#69746c}.card{padding:28px}.eyebrow{font-size:12px;font-weight:900;color:#557b5c;letter-spacing:.12em}.card h2{font-size:30px;margin:8px 0}.hint{color:#69746c;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{border:2px solid #ded8cc;background:#fff;border-radius:17px;padding:16px;text-align:left;cursor:pointer;min-height:70px}.choice:hover{border-color:#557b5c}.choice.on{background:#e3eddf;border-color:#557b5c}.choice b{display:block}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.field input,.field textarea{width:100%;border:2px solid #ded8cc;border-radius:14px;padding:13px;background:#fff;outline:none}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus{border-color:#557b5c}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:22px}.btn{border:0;border-radius:14px;padding:12px 17px;background:#557b5c;color:#fff;font-weight:900;cursor:pointer}.btn.alt{background:#ebe7dd;color:#29372f}.btn.gold{background:#c99b53}.map{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.mapitem{border:1px solid #ddd6c8;background:#fff;border-radius:15px;padding:14px;cursor:pointer;text-align:left}.mapitem.done{background:#e3eddf;border-color:#557b5c}.pts{float:right;color:#b1843d;font-weight:900;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{background:#f3eee4;border-radius:15px;padding:14px}.stat strong{font-size:25px;display:block}.badge{display:inline-block;background:#f1dfb8;border-radius:999px;padding:7px 10px;margin:4px;font-size:13px;font-weight:800}.notice{padding:13px;border-radius:15px;background:#eef5eb;margin:15px 0}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,120px);background:#243129;color:white;padding:12px 18px;border-radius:999px;transition:.25s;z-index:99}.toast.show{transform:translate(-50%,0)}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffdf9ee;border-top:1px solid #ddd6c8;padding:10px 18px;display:flex;justify-content:center;gap:10px;z-index:9}.modal{position:fixed;inset:0;background:#18231e99;display:none;align-items:flex-end;z-index:20;padding:10px}.modal.show{display:flex}.modalbox{width:min(900px,100%);max-height:90vh;overflow:auto;background:#fffdf9;border-radius:25px;padding:22px}.modalhead{display:flex;align-items:center;justify-content:space-between}@media(max-width:650px){.hero h1{font-size:30px}.grid,.map{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.topin{flex-wrap:wrap}.pill:last-of-type{display:none}.card{padding:20px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="logo">🌱 理出自己｜女力職涯探索</div><div class="spacer"></div><div class="pill" id="xp">⭐ 0 XP</div><div class="pill" id="done">0 / 17</div><button class="btn alt" id="openMap">🗺️ 關卡地圖</button></div><div class="progress"><div id="progress"></div></div></header>
<main>
<section class="hero"><div class="eyebrow">WOMEN POWER · CAREER EXPLORATION</div><h1>把自己，重新放回人生裡。</h1><p>這是一套 17 關的女力職涯探索。<b>不必照順序</b>，妳可以自由選擇想探索的關卡；每一關首次完成都能獲得 XP。</p><div class="notice">🧭 <b>玩法很簡單：</b>選關卡 → 完成任務 → 取得 XP → 解鎖徽章 → 最後生成妳的「人生脈絡地圖」。</div></section>
<div id="app"></div>
</main>
<div class="bottom"><button class="btn alt" id="prev">← 上一關</button><button class="btn" id="next">完成並前往下一關 →</button></div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><div><div class="eyebrow">自由探索模式</div><h2>17 關卡地圖</h2></div><button class="btn alt" id="closeMap">關閉</button></div><p class="hint">直接點任何關卡即可跳轉。完成後會顯示 ✓；同一關只會取得一次 XP。</p><div id="map" class="map"></div></div></div>
<div id="toast" class="toast"></div>
<script>
(function(){
'use strict';
const levels=[
['我是誰','安定自己','先給今天的自己一個名字。','text',20],
['生命靈數角色','安定自己','輸入出生日期，取得一個象徵性的生命角色。','birth',30],
['我的現在','安定自己','此刻的妳，最接近哪一種狀態？','single',20,['有點累','有點迷惘','想很多','想改變','正在重新開始','充滿期待']],
['最近的提醒','安定自己','最近有哪些訊號提醒妳需要照顧自己？','multi',30,['身體累','睡不好','煩躁','焦慮','生氣','沒精神','想改變','不知道怎麼了']],
['覺察雷達','看見自己','替情緒、需求、能量、界線與渴望打分數。','radar',30],
['人生回望','看見自己','妳走過的路，都可以成為職涯能力。','timeline',40],
['能力解鎖','看見自己','從生活情境看見妳早已擁有的韌力。','scenario',50],
['我的超能力','看見自己','把「我只是會做」翻譯成職涯能力。','skills',40,['時間管理','溝通協調','問題解決','情緒管理','資源整合','多工處理','危機應變','預算管理','規劃能力','同理與需求覺察','優先排序']],
['女力能量卡','女力賦能','選一張現在最需要的力量。','energy',50],
['找回自己','女力賦能','妳想重新找回哪一個自己？','single',30,['有勇氣的我','有力量的我','有創意的我','有夢想的我']],
['人生不只剩下應該','女力賦能','選出妳真正想放回人生的價值。','multi',50,['自由','成長','經濟穩定','家庭','學習','創作','助人','被看見','生活品質','自我照顧']],
['人生方向盤','築夢踏實','把感覺整理成可以行動的方向。','wheel',60],
['夢想大，行動小','築夢踏實','接下來 7 天，妳願意做哪一個小行動？','single',50,['整理一件卡住的事','完成一個15分鐘任務','主動詢問一個資源','為自己留一段時間','開始一個想做很久的嘗試','先休息，再重新出發']],
['支持圈','築夢踏實','知道什麼時候、向誰求助，也是一種能力。','multi',40,['家人','朋友','同事／夥伴','社群','專業人士','學習資源','AI工具','我自己']],
['我的決定','自決人生','把今天的覺察變成一個選擇。','decision',60],
['給自己的話','自決人生','留下未來的自己可以帶走的一句話。','reflection',60],
['理出自我・人生脈絡地圖','自決人生','整理妳完成的探索成果。','result',100]
];
const roles={1:['開創者','勇氣、自主、開始'],2:['連結者','關係、合作、感受'],3:['表達者','創意、表達、喜悅'],4:['建構者','穩定、實踐、建構'],5:['探索者','自由、探索、變化'],6:['照顧者','照顧、責任、愛'],7:['思考者','思考、內在、探索'],8:['實踐者','行動、成就、力量'],9:['理想者','理想、助人、完整']};
const energies=['🔥 勇氣','🌿 韌性','✨ 自信','🕊️ 自在','🎨 創意','🌙 夢想','🌱 成長','🧭 選擇','🚀 行動','🛡️ 界線','💗 溫柔','🤝 支持'];
const scenarios=['👧 孩子突然生病','💰 月底預算不足','🏠 家人意見不同','⏱️ 一天塞進很多事情'];
const defaults={nickname:'',birth:'',lifePath:null,state:'',awareness:[],radar:{emotion:3,need:3,energy:3,boundary:3,desire:3},timeline:['','',''],keywords:'',skills:[],energy:null,recover:'',values:[],wheel:['','','',''],action:'',support:[],decision:'',reflection:'',scenarios:[],score:{}};
let state;
try{state=JSON.parse(localStorage.getItem('careerWpliState')||'null')}catch(e){state=null}
if(!state)state=JSON.parse(JSON.stringify(defaults));
state.score=state.score||{};
let current=Number(localStorage.getItem('careerWpliCurrent')||0);if(current<0||current>16)current=0;
const el=id=>document.getElementById(id);
function save(){try{localStorage.setItem('careerWpliState',JSON.stringify(state));localStorage.setItem('careerWpliCurrent',String(current))}catch(e){}}
function escape(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){el('toast').textContent=t;el('toast').classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el('toast').classList.remove('show'),1600)}
function completed(i){const l=levels[i],t=l[3];if(t==='result')return true;if(t==='text')return !!state.nickname;if(t==='birth')return !!state.lifePath;if(t==='single')return !!state.state&&i===2||!!state.recover&&i===9||!!state.action&&i===12;if(t==='multi')return i===3?state.awareness.length>0:i===7?state.skills.length>0:i===10?state.values.length>0:state.support.length>0;if(t==='radar')return true;if(t==='timeline')return state.timeline.some(Boolean)||!!state.keywords;if(t==='scenario')return state.scenarios.length>0;if(t==='energy')return state.energy!==null;if(t==='wheel')return state.wheel.some(Boolean);if(t==='decision')return !!state.decision;if(t==='reflection')return !!state.reflection;return false}
function award(i){if(i===16||!completed(i)||state.score[i])return;state.score[i]=true;save();toast('完成「'+levels[i][0]+'」 +'+levels[i][4]+' XP');}
function totalXp(){return Object.keys(state.score).reduce((n,k)=>n+levels[+k][4],0)}
function badges(){const n=Object.keys(state.score).length;const a=[];if(n>=1)a.push('🌱 啟程者');if(n>=4)a.push('🔍 覺察者');if(n>=8)a.push('🌿 韌力行動者');if(n>=12)a.push('🧭 女力導航師');if(n>=16)a.push('🏆 人生主導者');return a}
function updateTop(){el('xp').textContent='⭐ '+totalXp()+' XP';const n=Object.keys(state.score).length;el('done').textContent=n+' / 17';el('progress').style.width=Math.round(n/17*100)+'%';el('prev').disabled=current===0;el('next').textContent=current===16?'重新整理成果':'完成並前往下一關 →'}
function singleButtons(opts,kind){return opts.map((x,i)=>'<button class="choice '+(kind===x?'on':'')+'" data-kind="single" data-index="'+i+'"><b>'+escape(x)+'</b></button>').join('')}
function multiButtons(opts,key,max){return opts.map((x,i)=>'<button class="choice '+(state[key]||[]).includes(x)?'on':''+'" data-kind="multi" data-index="'+i+'"><b>'+escape(x)+'</b></button>').join('')+'<div class="hint">已選 '+(state[key]||[]).length+' 項／最多 '+max+' 項</div>'}
function render(){
const l=levels[current],t=l[3];let body='';
if(t==='text')body='<div class="field"><label>妳希望我們怎麼稱呼妳？</label><input id="nickname" value="'+escape(state.nickname)+'" placeholder="例如：Leona、小綠、我自己"></div>';
if(t==='birth')body='<div class="field"><label>出生日期</label><input id="birth" value="'+escape(state.birth)+'" placeholder="1981/08/23" inputmode="numeric"></div>'+(state.lifePath?'<div class="notice">✨ <b>'+roles[state.lifePath][0]+'</b>｜生命靈數 '+state.lifePath+'<br>'+roles[state.lifePath][1]+'</div>':'');
if(t==='single'){let key=current===2?'state':current===9?'recover':'action';body='<div class="grid">'+singleButtons(l[5],state[key])+'</div>'}
if(t==='multi'){let key=current===3?'awareness':current===7?'skills':current===10?'values':'support';let max=current===3?3:current===7?6:current===10?4:3;body='<div class="grid">'+multiButtons(l[5],key,max)+'</div>'}
if(t==='radar'){body=['emotion','need','energy','boundary','desire'].map((k,i)=>'<div class="field"><label>'+['情緒','需求','能量','界線','渴望'][i]+'：<span id="r'+k+'">'+state.radar[k]+'</span></label><input type="range" min="1" max="5" value="'+state.radar[k]+'" data-range="'+k+'"></div>').join('')}
if(t==='timeline')body=['我完成過的事','我撐過來的事','讓我改變的事'].map((x,i)=>'<div class="field"><label>'+x+'</label><textarea data-time="'+i+'">'+escape(state.timeline[i])+'</textarea></div>').join('')+'<div class="field"><label>三個代表我的字</label><input id="keywords" value="'+escape(state.keywords)+'" placeholder="堅持、照顧、重新開始"></div>';
if(t==='scenario')body='<div class="grid">'+scenarios.map((x,i)=>'<button class="choice '+(state.scenarios.includes(i)?'on':'')+'" data-kind="scenario" data-index="'+i+'"><b>'+x+'</b><span class="hint">點選解鎖生活中的能力</span></button>').join('')+'</div><div class="notice">已解鎖：'+(state.scenarios.length?'資源整合・問題解決・時間管理・溝通協調':'尚未選擇')+'</div>';
if(t==='energy')body='<div class="grid">'+energies.map((x,i)=>'<button class="choice '+(state.energy===i?'on':'')+'" data-kind="energy" data-index="'+i+'"><b>'+x+'</b></button>').join('')+'</div>'+(state.energy!==null?'<div class="notice">今日訊息：妳不必一次完成全部，先完成一個小步驟。</div>':'');
if(t==='wheel')body=[['想要什麼？','我想要……'],['不要什麼？','我不要……'],['願意嘗試什麼？','我願意試……'],['先做什麼？','我決定先……']].map((x,i)=>'<div class="field"><label>'+x[0]+'</label><textarea data-wheel="'+i+'" placeholder="'+x[1]+'">'+escape(state.wheel[i])+'</textarea></div>').join('');
if(t==='decision')body='<div class="field"><textarea id="decision" placeholder="我決定先……">'+escape(state.decision)+'</textarea></div>';
if(t==='reflection')body='<div class="field"><textarea id="reflection" placeholder="我願意把自己重新放回人生裡。">'+escape(state.reflection)+'</textarea></div>';
if(t==='result')body=resultHtml();
el('app').innerHTML='<section class="card"><div class="eyebrow">第 '+(current+1)+' / 17 關 · '+l[1]+' · +'+l[4]+' XP</div><h2>'+l[0]+'</h2><p class="hint">'+l[2]+'</p>'+body+'</section>';bind();updateTop();
}
function resultHtml(){const b=badges();return '<div class="stats"><div class="stat"><span>總 XP</span><strong>'+totalXp()+'</strong></div><div class="stat"><span>完成</span><strong>'+Object.keys(state.score).length+'/17</strong></div><div class="stat"><span>徽章</span><strong>'+b.length+'</strong></div></div><div class="notice">🌱 '+escape(state.nickname||'我的')+'，妳已經開始把生活經驗重新整理成自己的力量。</div><p><b>生命角色：</b>'+(state.lifePath?roles[state.lifePath][0]:'—')+'<br><b>現在：</b>'+escape(state.state||'—')+'<br><b>能力：</b>'+escape((state.skills||[]).join('、')||'—')+'<br><b>價值：</b>'+escape((state.values||[]).join('、')||'—')+'<br><b>7日行動：</b>'+escape(state.action||'—')+'</p><p><b>我的決定：</b>'+escape(state.decision||'—')+'</p><div class="notice">「'+escape(state.reflection||'我願意把自己重新放回人生裡。')+'」</div>'+b.map(x=>'<span class="badge">'+x+'</span>').join('')+'<div class="actions"><button class="btn gold" id="reset">重新開始</button></div>'}
function bind(){
const app=el('app');app.onclick=function(e){const b=e.target.closest('[data-kind]');if(!b)return;const l=levels[current],kind=b.dataset.kind,i=+b.dataset.index;if(kind==='single'){const key=current===2?'state':current===9?'recover':'action';state[key]=l[5][i]}if(kind==='multi'){const key=current===3?'awareness':current===7?'skills':current===10?'values':'support';const max=current===3?3:current===7?6:current===10?4:3;const v=l[5][i],arr=state[key];const p=arr.indexOf(v);if(p>=0)arr.splice(p,1);else if(arr.length<max)arr.push(v);else{toast('最多選 '+max+' 項');return}}if(kind==='scenario'){const p=state.scenarios.indexOf(i);if(p>=0)state.scenarios.splice(p,1);else state.scenarios.push(i)}if(kind==='energy')state.energy=i;save();render()};
['nickname','birth','keywords','decision','reflection'].forEach(id=>{const x=el(id);if(x)x.addEventListener('input',()=>{if(id==='nickname')state.nickname=x.value;if(id==='birth')state.birth=x.value;if(id==='keywords')state.keywords=x.value;if(id==='decision')state.decision=x.value;if(id==='reflection')state.reflection=x.value;save()})});document.querySelectorAll('[data-range]').forEach(x=>x.addEventListener('input',()=>{state.radar[x.dataset.range]=+x.value;el('r'+x.dataset.range).textContent=x.value;save()}));document.querySelectorAll('[data-time]').forEach(x=>x.addEventListener('input',()=>{state.timeline[+x.dataset.time]=x.value;save()}));document.querySelectorAll('[data-wheel]').forEach(x=>x.addEventListener('input',()=>{state.wheel[+x.dataset.wheel]=x.value;save()}));const r=el('reset');if(r)r.addEventListener('click',()=>{if(confirm('確定重新開始嗎？')){state=JSON.parse(JSON.stringify(defaults));current=0;save();render()}})
}
function goNext(){if(current===0){state.nickname=(el('nickname')||{}).value?.trim()||state.nickname;if(!state.nickname){toast('請先輸入暱稱');return}}if(current===1){const v=(el('birth')||{}).value?.trim()||state.birth;if(!/^\d{4}[\/\-.]\d{1,2}[\/\-.]\d{1,2}$/.test(v)){toast('請輸入日期，例如 1981/08/23');return}state.birth=v;let n=(v.match(/\d/g)||[]).reduce((a,b)=>a+Number(b),0);while(n>9)n=String(n).split('').reduce((a,b)=>a+Number(b),0);state.lifePath=n;save();render();return}if(current<16){award(current);current++;save();render();scrollTo(0,0)}else{render();toast('成果已整理完成')}}
function goPrev(){if(current>0){current--;save();render();scrollTo(0,0)}}
function openMap(){const map=el('map');map.innerHTML=levels.map((l,i)=>'<button class="mapitem '+(completed(i)?'done':'')+'" data-go="'+i+'"><span class="pts">+'+l[4]+' XP</span><b>'+(i+1)+'. '+l[0]+'</b><br><span class="hint">'+l[1]+' '+(completed(i)?'✓ 已完成':'')+'</span></button>').join('');el('modal').classList.add('show');map.onclick=e=>{const b=e.target.closest('[data-go]');if(b){current=+b.dataset.go;el('modal').classList.remove('show');save();render();scrollTo(0,0)}}}
el('next').addEventListener('click',goNext);el('prev').addEventListener('click',goPrev);el('openMap').addEventListener('click',openMap);el('closeMap').addEventListener('click',()=>el('modal').classList.remove('show'));el('modal').addEventListener('click',e=>{if(e.target.id==='modal')el('modal').classList.remove('show')});
render();
})();
</script>
</body>
</html>
